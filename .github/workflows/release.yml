name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact: pwgen-linux-amd64
            cc: g++
          - os: macos-latest
            artifact: pwgen-macos-arm64
            cc: clang++
          - os: windows-latest
            artifact: pwgen-windows-amd64.exe
            cc: g++

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: |
          ${{ matrix.cc }} -std=c++17 -Wall -Wextra -O2 -o ${{ matrix.artifact }} src/main.cc

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
